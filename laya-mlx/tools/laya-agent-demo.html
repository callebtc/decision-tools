<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laya Flights Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input, select { padding: 8px; width: 240px; }
  button { padding: 10px 24px; margin-top: 16px; font-size: 15px; }
  #results { display: none; margin-top: 24px; padding: 16px;
             border: 1px solid #9aa0a6; border-radius: 8px; }
  #results h2 { margin-top: 0; }
  .flight { padding: 6px 0; }
</style>
</head>
<body>
<h1>Flight search</h1>
<form id="search" onsubmit="return false">
  <label for="from">From</label>
  <input type="text" id="from" name="from" placeholder="City or airport">
  <label for="to">To</label>
  <input type="text" id="to" name="to" placeholder="City or airport">
  <label for="date">Departure date</label>
  <input type="text" id="date" name="date" placeholder="YYYY-MM-DD">
  <label for="triptype">Trip type</label>
  <select id="triptype" name="triptype">
    <option>Round trip</option>
    <option>One way</option>
  </select>
  <br>
  <button id="go" type="button">Search flights</button>
</form>
<div id="results">
  <h2>Results</h2>
  <div id="summary"></div>
  <div class="flight">LX 316 · 06:45 → 08:05 · $84</div>
  <div class="flight">U2 3962 · 12:20 → 13:45 · $61</div>
  <div class="flight">BA 717 · 18:30 → 19:55 · $129</div>
</div>
<script>
  document.getElementById("go").addEventListener("click", () => {
    const f = document.getElementById("from").value.trim();
    const t = document.getElementById("to").value.trim();
    const d = document.getElementById("date").value.trim();
    if (!f || !t || !d) return;
    const tt = document.getElementById("triptype").value;
    // Simulated network latency: results appear late to exercise WAIT.
    setTimeout(() => {
      document.getElementById("summary").textContent =
        `${f} → ${t} · ${d} · ${tt} · 3 flights found`;
      document.getElementById("results").style.display = "block";
    }, 700);
  });
</script>
</body>
</html>
